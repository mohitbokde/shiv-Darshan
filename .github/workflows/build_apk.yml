name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: कोड डाउनलोड
        uses: actions/checkout@v4

      - name: Java लगाना
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter लगाना
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android फ़ोल्डर बनाना
        run: |
          mkdir -p /tmp/keep
          cp -r lib /tmp/keep/lib
          cp pubspec.yaml /tmp/keep/pubspec.yaml
          flutter create --platforms=android --org com.mohit --project-name shiv_darshan .
          rm -rf lib pubspec.yaml test
          cp -r /tmp/keep/lib lib
          cp /tmp/keep/pubspec.yaml pubspec.yaml
          sed -i 's/android:label="[^"]*"/android:label="शिव दर्शन"/' android/app/src/main/AndroidManifest.xml

      - name: ऐप आइकन (त्रिशूल) लगाना
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi*
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p android/app/src/main/res/mipmap-$d
            cp icons/mipmap-$d/ic_launcher.png android/app/src/main/res/mipmap-$d/ic_launcher.png
          done

      - name: Packages लाना
        run: flutter pub get

      - name: APK बनाना
        run: |
          set +e
          flutter build apk --release 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            sed -n '/What went wrong/,/\* Try/p' build.log | head -40 > err.txt
            [ -s err.txt ] || tail -30 build.log > err.txt
            msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' err.txt)
            echo "::error title=असली-एरर::$msg"
            exit "$code"
          fi

      - name: APK सेव करना
        uses: actions/upload-artifact@v4
        with:
          name: shiv-darshan-apk
          path: build/app/outputs/flutter-apk/app-release.apk
